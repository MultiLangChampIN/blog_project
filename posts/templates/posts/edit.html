{% extends "posts/parent.html" %}
{% load crispy_forms_tags %}


{% block content%}

<div class="main-container">
    <div class="topbar">
        <h1 class="title">create a blogpost</h1>
    </div>
    <form action="" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {% comment %} {{form.title|as_crispy_field}}
        {{form.content|as_crispy_field}} {% endcomment %}
        {{form|crispy}}

        <button type="submit" class="btn btn-primary">submit edits </button>
    </form>
</div>

{% endblock %}
