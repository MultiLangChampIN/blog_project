{% load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>blog app</title>
    <link rel="stylesheet" href="{% static 'posts/main.css'%}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar">
        <div class="navbar-logo">
            MY LOGO
        </div>
        <ul class="navbar-links">
            <li>
                <a href="{% url 'home'%}" class="{% if request.path == '/' %}active{%endif%}">home</a>
            </li>
            {% if user.is_authenticated %}
            <li>
                <a href="{% url 'blogpage'%}" class="{% if request.path == '/blogposts' %}active{%endif%}" >MyBlogposts</a>
            </li>
            <li>
                <a href="{% url "profile" %}" class="{% if request.path == '/users/profile' %}active{%endif%}">{{user.username}}</a>
            </li>
            <li>
                <a href="{% url 'logoutconfirm' %}" class="{% if request.path == '/users/confirm/logout' %}active{%endif%}">Logout</a>
            </li>
            {% else %}
             <li>
                <a href="{% url 'signup'%}" class="{% if request.path == 'users/signup' %}active{%endif%}" >Sign up</a>
            </li>
             <li>
                <a href="{% url 'login'%}" class="{% if request.path == 'users/login' %}active{%endif%}" >Log in </a>
            </li>

            {% endif %}
            
        </ul>

    </nav>
    <div class="container">
        {%block content%}

        {% endblock %}


    </div>
   
    
</body>
</html>
